<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مباراة الطهارة — الاستنجاء والاستبراء</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF3EE; --stage:#ffffff; --ink:#0D2B22; --muted:#56756A; --gold:#C8931A; --hot:#E8B53A;
  --water:#1C7FA6; --ok:#1E9E61; --no:#D2412C; --line:rgba(13,43,34,.12); --pitch:#2F8F4E; --pitch2:#287F44;
  --oA:#D64541; --oB:#2E7BD6; --oC:#1E9E61; --oD:#E0A800;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081A14;--stage:#10291F;--ink:#ECF7F1;--muted:#94B6A8;--line:rgba(255,255,255,.12)}}
:root[data-theme="dark"]{--bg:#081A14;--stage:#10291F;--ink:#ECF7F1;--muted:#94B6A8;--line:rgba(255,255,255,.12)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--hot);outline-offset:2px}

/* tabs */
.tabs{display:flex;gap:6px;padding:8px;background:#0B2A1E;align-items:center}
.tabs button{border:0;border-radius:12px;padding:10px 18px;font-size:17px;font-weight:700;background:#17402F;color:#cfe8dc}
.tabs button.on{background:var(--gold);color:#fff}
.tabs .sp{flex:1}
.tabs .sm{font-size:15px;padding:8px 12px}

/* mini standings (lesson mode) */
.mini{display:flex;gap:6px;padding:6px 8px;background:#0F3426;overflow-x:auto}
.chip{display:flex;align-items:center;gap:6px;border-radius:12px;padding:4px 8px;color:#fff;font-weight:700;font-size:15px;white-space:nowrap}
.chip b{font-size:20px;min-width:22px;text-align:center}
.chip button{border:0;border-radius:8px;width:30px;height:28px;font-weight:700;background:rgba(0,0,0,.3);color:#fff;font-size:16px}

.view{flex:1;overflow:auto;display:none}
.view.on{display:block}

/* ===== lesson ===== */
.stage{padding:18px 16px 10px;display:flex;justify-content:center}
.slide{width:100%;max-width:1020px}
.round{display:inline-block;background:var(--water);color:#fff;border-radius:999px;padding:4px 18px;font-weight:700;font-size:clamp(15px,2vw,19px);margin-bottom:6px}
h1{font-size:clamp(32px,6.5vw,64px);margin:.15em 0;line-height:1.2}
h2{font-size:clamp(24px,4.4vw,42px);margin:4px 0 14px;line-height:1.3}
.sub{font-size:clamp(17px,2.5vw,23px);color:var(--muted);margin:0 0 14px}
.center{text-align:center}
.big{font-size:clamp(64px,12vw,130px);line-height:1}
.aya{font-family:Amiri,serif;font-size:clamp(24px,4.4vw,40px);line-height:1.9;text-align:center;background:var(--stage);border:2px solid var(--gold);border-radius:20px;padding:16px}
.aya small{display:block;font-size:.5em;color:var(--gold)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tile{background:var(--stage);border-radius:18px;padding:14px;text-align:center;border:3px solid var(--line);font-size:clamp(17px,2.4vw,22px);min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile .e{font-size:clamp(46px,7vw,66px);line-height:1}
.tile .ans{font-weight:700}
.tile.ok{border-color:var(--ok)} .tile.ok .ans{color:var(--ok)}
.tile.no{border-color:var(--no)} .tile.no .ans{color:var(--no)}
.tile.info{border-color:var(--water)} .tile.info .ans{color:var(--water)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:10px}
.box{background:var(--stage);border-radius:18px;padding:18px;font-size:clamp(18px,2.6vw,24px);line-height:1.7;border:2px solid var(--line)}
.box h3{margin:0 0 6px;font-size:1.25em;color:var(--water)}
.tag{display:inline-block;background:var(--water);color:#fff;border-radius:999px;padding:2px 12px;font-size:.85em;margin:2px 0}
.steps{display:grid;gap:12px}
.step{display:flex;align-items:center;gap:14px;background:var(--stage);border-radius:16px;padding:14px 16px;font-size:clamp(18px,2.6vw,24px);border:2px solid var(--line)}
.step .n{flex:0 0 52px;height:52px;border-radius:50%;background:var(--water);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700}
.step .x{margin-inline-start:auto;font-weight:700;color:var(--gold);white-space:nowrap}
.math{font-size:clamp(40px,8vw,84px);font-weight:700;color:var(--gold);text-align:center;margin:8px 0}
.rules{padding:0;margin:0}
.rules li{font-size:clamp(19px,2.8vw,26px);margin:10px 0;list-style:none;background:var(--stage);border-radius:14px;padding:12px 16px;border:2px solid var(--line)}
.hint{color:var(--muted);font-size:15px;text-align:center;margin-top:10px}
.lbar{position:sticky;bottom:0;display:flex;gap:8px;justify-content:center;align-items:center;padding:10px;background:var(--bg)}
.lbar button{border:0;border-radius:12px;padding:10px 18px;font-size:17px;font-weight:700;background:var(--gold);color:#fff;min-width:100px}
.lbar span{font-weight:700;color:var(--muted)}

/* ===== race ===== */
.race{padding:10px 12px;max-width:1200px;margin:0 auto}
.track{position:relative;background:repeating-linear-gradient(90deg,#2E8B48 0 70px,#279040 70px 140px);border-radius:14px;padding:6px 8px;border:4px solid #fff;box-shadow:0 0 0 4px #1E6B35,inset 0 0 40px rgba(0,0,0,.25);overflow:hidden}
.track::before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:3px solid rgba(255,255,255,.7)}
.track::after{content:"";position:absolute;top:50%;left:50%;width:clamp(90px,14vw,150px);aspect-ratio:1;border:3px solid rgba(255,255,255,.7);border-radius:50%;transform:translate(-50%,-50%)}
.goal{position:absolute;inset-inline-end:0;top:6%;height:88%;width:46px;z-index:1}
.goal svg{width:100%;height:100%;display:block}
.goal.shake{animation:net .6s}
@keyframes net{20%{transform:scaleX(1.25)}50%{transform:scaleX(.9)}80%{transform:scaleX(1.1)}}
.ball{position:absolute;top:58%;inset-inline-end:-16px;font-size:clamp(16px,2.2vw,22px);line-height:1;transition:transform .7s ease-in}
.runner.run .ball{animation:roll .3s linear infinite}
@keyframes roll{to{rotate:-360deg}}
.ball.scored{transform:translateX(-42px) scale(.8)}
.lane{position:relative;z-index:2;display:flex;align-items:center;gap:8px;height:clamp(62px,10vh,84px);border-bottom:3px solid rgba(255,255,255,.75)}
.lane:last-child{border-bottom:0}
.lane.out{opacity:.35}
.lbl{flex:0 0 clamp(96px,14vw,150px);color:#fff;font-weight:700;font-size:clamp(13px,1.6vw,17px);line-height:1.25;border-radius:10px;padding:4px 8px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.lbl small{display:block;font-weight:400;opacity:.95}
.road{position:relative;flex:1;height:100%}
.road .ticks{position:absolute;inset:0;display:flex}
.road .ticks{inset-inline-end:46px}
.road .ticks i{flex:1;border-inline-start:1px dashed rgba(255,255,255,.22)}
.runner{position:absolute;z-index:2;top:50%;transform:translateY(-50%);width:clamp(40px,5.5vw,56px);display:flex;justify-content:center;transition:inset-inline-start .9s cubic-bezier(.3,1.4,.5,1);inset-inline-start:0}
.runner .pl{height:clamp(62px,11vh,92px);width:auto;display:block;margin:0 auto;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.runner.run .pl{animation:bob .2s infinite alternate}
@keyframes bob{from{translate:0 0;rotate:-4deg}to{translate:0 -6px;rotate:4deg}}
.runner .lg1,.runner .lg2{transform-origin:20px 40px}
.runner.run .lg1{animation:legA .18s infinite alternate}
.runner.run .lg2{animation:legB .18s infinite alternate}
@keyframes legA{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
@keyframes legB{from{transform:rotate(30deg)}to{transform:rotate(-30deg)}}
.runner.hurt{animation:shake .4s}
@keyframes shake{25%{translate:6px}75%{translate:-6px}}
.pos{position:absolute;top:2px;inset-inline-start:4px;color:#fff;font-weight:700;font-size:13px;opacity:.8}
.lane .back{border:0;border-radius:8px;width:44px;height:36px;background:rgba(0,0,0,.35);color:#fff;font-weight:700;font-size:15px;flex:0 0 auto}

.qcard{background:var(--stage);border-radius:18px;margin-top:12px;padding:14px 16px;border:2px solid var(--line)}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qnum{background:var(--gold);color:#fff;border-radius:999px;padding:3px 14px;font-weight:700}
.clock{margin-inline-start:auto;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:60px;text-align:center}
.clock.warn{color:var(--no)}
.qtext{font-size:clamp(22px,3.4vw,34px);font-weight:700;margin:4px 0 12px;line-height:1.4}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 14px;color:#fff;font-size:clamp(17px,2.5vw,24px);font-weight:600;transition:opacity .3s,transform .3s}
.opt .L{flex:0 0 44px;height:44px;border-radius:10px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:24px;font-weight:700}
.opts.rev .opt{opacity:.25}
.opts.rev .opt.right{opacity:1;transform:scale(1.03);box-shadow:0 0 0 4px var(--hot)}
.who{display:none;margin-top:12px;flex-wrap:wrap;gap:8px;align-items:center}
.who.on{display:flex}
.who .t{font-weight:700;font-size:18px}
.who .tb{border:3px solid transparent;border-radius:12px;padding:8px 14px;color:#fff;font-weight:700;font-size:16px;opacity:.55}
.who .tb.sel{opacity:1;border-color:var(--hot);transform:scale(1.05)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.ctrl button{border:0;border-radius:12px;padding:12px 18px;font-size:18px;font-weight:700;background:#17402F;color:#fff}
.ctrl .main{background:var(--gold)}
.ctrl button:disabled{opacity:.35;cursor:default}

/* overlays */
.ov{position:fixed;inset:0;display:none;place-items:center;z-index:9;padding:16px}
.ov.on{display:grid}
.setup{background:rgba(6,24,17,.97);color:#fff;overflow:auto}
.setup .in{width:100%;max-width:720px;text-align:center}
.setup h2{color:var(--hot)}
.pickT{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.pickT button{border:4px solid transparent;border-radius:16px;padding:10px;color:#fff;font-weight:700;font-size:17px;opacity:.4}
.pickT button.on{opacity:1;border-color:var(--hot)}
.pickT .pl{height:90px;width:auto;display:block;margin:0 auto 4px}
.len{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.len button{border:2px solid var(--gold);background:none;color:#fff;border-radius:12px;padding:8px 18px;font-size:18px;font-weight:700}
.len button.on{background:var(--gold)}
.go{margin-top:16px;background:var(--gold);color:#fff;border:0;border-radius:14px;padding:14px 40px;font-size:24px;font-weight:700}
.ghost{margin-top:10px;background:none;color:#cfe8dc;border:2px solid #cfe8dc;border-radius:12px;padding:10px 22px;font-size:17px}
.splash{pointer-events:none}
.splash div{font-size:clamp(50px,12vw,150px);font-weight:700;color:#fff;text-align:center;text-shadow:0 4px 30px rgba(0,0,0,.7);animation:zoom 1.2s forwards}
@keyframes zoom{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}80%{opacity:1}100%{transform:scale(1);opacity:0}}
.winov{background:rgba(6,24,17,.95);color:#fff;text-align:center}
.winov .cup{font-size:clamp(56px,11vh,110px);line-height:1}
.winov h1{color:var(--hot)}
.winov #winRunner .pl{height:clamp(150px,32vh,300px);width:auto;display:block;margin:0 auto}
.cap{font-size:clamp(28px,5vw,52px);font-weight:700;color:#fff;margin:6px 0}
.cel-eng .pl{animation:arms 1s ease-in-out infinite alternate}
@keyframes arms{from{transform:scale(1)}to{transform:scale(1.12) translateY(-12px)}}
.cel-arg .pl{animation:sky 1.2s ease-in-out infinite alternate}
@keyframes sky{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-30px) rotate(3deg)}}
.cel-bar .pl{animation:slide 2.2s ease-out infinite}
@keyframes slide{0%{transform:translateX(260px) rotate(0)}55%{transform:translateX(0) rotate(-14deg)}100%{transform:translateX(0) rotate(-14deg)}}
.cel-rma .pl{animation:dance .45s ease-in-out infinite alternate}
@keyframes dance{from{transform:translateX(-18px) rotate(-9deg)}to{transform:translateX(18px) translateY(-10px) rotate(9deg)}}
.cel-por .pl{animation:siu 2.4s ease-in-out infinite}
@keyframes siu{0%{transform:translateY(0)}15%{transform:translateY(12px) scaleY(.93)}40%{transform:translateY(-110px) rotateY(180deg)}60%{transform:translateY(0) rotateY(180deg) scale(1.05,.95)}70%,100%{transform:translateY(0) rotateY(180deg)}}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:10}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="tabs">
  <button id="tabL" class="on">📖 الشرح</button>
  <button id="tabR">⚽ المباراة</button>
  <span class="sp"></span>
  <button class="sm" id="sndBtn">🔊</button>
  <button class="sm" id="setBtn">⚙️ الفرق</button>
</div>
<div class="mini" id="mini"></div>

<section class="view on" id="vL">
  <div class="stage"><div class="slide" id="slide"></div></div>
  <div class="lbar"><button id="prev">→ السابق</button><span id="pg"></span><button id="next">التالي ←</button></div>
</section>

<section class="view" id="vR"><div class="race">
  <div class="track" id="track"></div>
  <div class="qcard">
    <div class="qtop"><span class="qnum" id="qnum"></span><span id="qhint" style="color:var(--muted)"></span><span class="clock" id="clock"></span></div>
    <div class="qtext" id="qtext"></div>
    <div class="opts" id="opts"></div>
    <div class="who" id="who"><span class="t">من رفع الإجابة الصحيحة؟</span></div>
  </div>
  <div class="ctrl">
    <button id="bTime" class="main">⏱️ ١٠ ثواني</button>
    <button id="bRev">👀 كشف الإجابة</button>
    <button id="bGo" class="main">🏃 تقدّم!</button>
    <button id="bSkip">⏭️ سؤال آخر</button>
  </div>
</div></section>

<div class="ov setup" id="setup"><div class="in">
  <h2>⚽ المباراة</h2>
  <p>اختر الفرق المشاركة</p>
  <div class="pickT" id="pickT"></div>
  <p>طول الملعب (عدد الخطوات)</p>
  <div class="len" id="len"></div>
  <button class="go" id="go">ابدأ المباراة ⚽</button>
</div></div>
<div class="ov splash" id="splash"><div id="splashT"></div></div>
<div class="ov winov" id="winov"><div>
  <div class="cup">🏆</div><div id="winRunner"></div><h1 id="winT"></h1>
  <div class="dua">«اللَّهُمَّ طَهِّرْ قَلْبِي مِنْ كُلِّ آفَةٍ تَمْحَقُ دِينِي وَتُبْطِلُ بِهِ عَمَلِي، اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ وَاجْعَلْنِي مِنَ الْمُتَطَهِّرِينَ»</div>
  <button class="ghost" id="closeWin">إغلاق</button>
</div></div>
<canvas id="cf"></canvas>

<script>
/* ---------- teams ---------- */
const TEAMS=[
 {id:"eng",cap:"🙌 الذراعان مفتوحتان!",name:"إنجلترا",player:"بيلنجهام",c:"#C8102E",shirt:"#FFFFFF",st:null,shorts:"#1D2A5C",flag:"🏴󠁧󠁢󠁥󠁮󠁧󠁿"},
 {id:"arg",cap:"☝️☝️ الإشارة للسماء!",name:"الأرجنتين",player:"ميسي",c:"#5DADE2",shirt:"#75AADB",st:"#FFFFFF",shorts:"#1B1B3A",flag:"🇦🇷"},
 {id:"bar",cap:"🛝 تزحلق على الركب!",name:"برشلونة",player:"يامال",c:"#A50044",shirt:"#A50044",st:"#004D98",shorts:"#004D98",flag:"🔵🔴"},
 {id:"rma",cap:"💃 رقصة الفوز!",name:"ريال مدريد",player:"فينيسيوس",c:"#B8962E",shirt:"#FFFFFF",st:null,shorts:"#FFFFFF",flag:"⚪"},
 {id:"por",cap:"🔥 SIUUU!",name:"البرتغال",player:"كريستيانو",c:"#C1272D",shirt:"#C1272D",st:null,shorts:"#006600",flag:"🇵🇹"}

let AC;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type="sine",vol=.25,when=0,slide){const a=ac();if(!a||!sound)return;const t=a.currentTime+when;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,vol=.2,when=0){const a=ac();if(!a||!sound)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();
  f.type="bandpass";f.frequency.value=1200;s.buffer=b;g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+when)}
const SFX={

  reveal(){tone(400,.2,"sine",.2,0,900)},
  tick(){tone(1200,.05,"square",.08)}, tickHi(){tone(1600,.08,"square",.15)},
  buzzer(){tone(140,.8,"sawtooth",.3);tone(147,.8,"square",.15)},
  run(){for(let i=0;i<6;i++)noise(.05,.35,i*.12)},
  crowd(){noise(1.6,.25);tone(500,.3,"triangle",.15,.1)},
  back(){tone(500,.4,"sawtooth",.2,0,120)},
  sel(){tone(900,.06,"square",.1)},
  fanfare(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i==5?.8:.18,"triangle",.3,i*.16));noise(2.5,.18,.3)}

<div class="box"><div class="big">💧</div><h3>البول</h3>الماء <b>فقط</b><br>غسلة واحدة بعد زوال النجاسة</div>
<div class="box"><div class="big">🚽</div><h3>الغائط</h3>تعدّى المخرج؟ ← <b>الماء فقط</b><br>لم يتعدَّ؟ ← ماء <b>أو</b> حجر / مناديل حتى ينظف<br><span class="tag">والماء أفضل 💧</span></div></div>`,
`${L("ماء الاستنجاء")}<h2>ماء الاستنجاء طاهر إذا…</h2><div class="grid">
${st("🎨","اللون","لم يتغير","info")}${st("👅","الطعم","لم يتغير","info")}${st("👃","الرائحة","لم تتغير","info")}${st("🚫","أجزاء من الغائط","لا يوجد","info")}</div>
<div class="math">= طاهر ✅</div>`,
`${L("الخرطات التسعة")}<div class="math">٣ × ٣ = ٩</div><div class="steps">
<div class="step"><span class="n">١</span>المسح بالأصابع من المقعدة إلى أصل القضيب<span class="x">× ٣</span></div>
<div class="step"><span class="n">٢</span>المسح من أصل القضيب إلى رأس الحشفة<span class="x">× ٣</span></div>
<div class="step"><span class="n">٣</span>عصر الحشفة<span class="x">× ٣</span></div></div>
<p class="hint">🔇 أي تعليق في هذه الشريحة = خطوة للوراء</p>`,
`${L("فائدة الاستبراء")}<h2>خرج بلل مشكوك… ما حكمه؟</h2><div class="two">
<div class="box"><h3>✅ استبرأ</h3>البلل <b>طاهر</b><br>ولا يعيد الوضوء</div>
<div class="box"><h3>❌ لم يستبرئ</h3>البلل <b>نجس</b> — حكمه بول<br>إلا إذا مضى وقت طويل ولم يخرج شيء</div></div>
<div class="box"><h3>💡 بعد الجنابة</h3>تبوّل ثم خرجت رطوبة مشتبهة ← <b>ليست منيّاً</b></div>`,
`${L("آداب الحمّام")}<h2>آداب قضاء الحاجة 🚻</h2><div class="grid">
${st("🕋","","لا يستقبل القبلة ولا يستدبرها","info")}${st("🤚","","ينظّف بيده الشمال","info")}
${st("🪑","","يجلس… حتى لا يرتد البول","info")}${st("🚪","","يستتر عن الناس","info")}
${st("🚱","","لا يبول في الماء الراكد","info")}${st("🛣️🌳","","ليس في الطريق ولا الظل","info")}
${st("🤐","","لا يُسلّم ولا يرد السلام","info")}${st("🧽","","ينظّف المكان بعده","info")}</div>`,
`<div class="center"><div class="big">🏁</div><h1>انتهى الشرح…</h1><h2 style="color:var(--gold)">المباراة تبدأ!</h2>
<ul class="rules" style="text-align:right"><li>❓ كل الفرق تجاوب على <b>نفس السؤال</b></li><li>⏱️ ١٠ ثواني للتشاور بصوت منخفض</li>
<li>📝 اكتبوا الحرف على الورقة… وعند الصافرة ارفعوها معاً</li><li>✅ صحيح = خطوة للأمام &nbsp;|&nbsp; 🔇 فوضى = خطوة للوراء</li></ul>
<p class="hint">اضغط «⚽ المباراة» بالأعلى</p></div>`
];
let cur=0;
function showSlide(){document.getElementById("slide").innerHTML=SLIDES[cur];document.getElementById("pg").textContent=(cur+1)+" / "+SLIDES.length;document.getElementById("vL").scrollTop=0}
document.getElementById("next").onclick=()=>{if(cur<SLIDES.length-1){cur++;showSlide();tone(300,.25,"triangle",.12,0,900)}};
document.getElementById("prev").onclick=()=>{if(cur>0){cur--;showSlide()}};

/* ---------- tabs ---------- */
function tab(r){document.getElementById("tabL").classList.toggle("on",!r);document.getElementById("tabR").classList.toggle("on",r);
  document.getElementById("vL").classList.toggle("on",!r);document.getElementById("vR").classList.toggle("on",r);
  document.getElementById("mini").style.display=r?"none":"flex";if(r){drawTrack();showQ()}}
document.getElementById("tabL").onclick=()=>tab(false);
document.getElementById("tabR").onclick=()=>{tab(true);SFX.whistle()};

/* ---------- mini standings (lesson) ---------- */
function drawMini(){const m=document.getElementById("mini");m.innerHTML="";
  S.active.forEach(id=>{const t=T(id),c=document.createElement("div");c.className="chip";c.style.background=t.c;
    c.innerHTML=`${t.flag} ${t.name}<b>${S.pos[id]||0}</b><button title="خطوة للوراء">−١</button><button title="خطوة للأمام">+١</button>`;
    const [bk,fw]=c.querySelectorAll("button");bk.onclick=()=>move(id,-1);fw.onclick=()=>move(id,1);m.appendChild(c)})}

/* ---------- track ---------- */
function drawTrack(){const tr=document.getElementById("track");tr.innerHTML="";
  S.active.forEach(id=>{const t=T(id),p=S.pos[id]||0,lane=document.createElement("div");
    lane.className="lane"+(S.tie&&!S.tie.includes(id)?" out":"");
    lane.innerHTML=`<div class="lbl" style="background:${t.c}">${t.flag} ${t.name}<small>${t.player}</small></div>
      <div class="road"><div class="ticks">${"<i></i>".repeat(S.steps)}</div><div class="goal" id="goal_${id}">${GOAL}</div>
      <div class="runner" id="r_${id}" style="inset-inline-start:${pct(p)}">${runner(t)}<span class="ball" id="ball_${id}">⚽</span></div><span class="pos">${p}/${S.steps}</span></div>
      <button class="back" title="فوضى: خطوة للوراء">⬅️</button>`;
    lane.querySelector(".back").onclick=()=>move(id,-1);tr.appendChild(lane)})}
function pct(p){return `calc(${Math.min(p,S.steps)/S.steps} * (100% - 120px))`}
const GOAL=`<svg viewBox="0 0 46 100" preserveAspectRatio="none" aria-hidden="true"><defs><pattern id="nt" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0L6 6M6 0L0 6" stroke="rgba(255,255,255,.55)" stroke-width="1"/></pattern></defs>
<rect x="6" y="4" width="38" height="92" fill="url(#nt)"/><path d="M44 4H6V96H44" fill="none" stroke="#fff" stroke-width="5"/><path d="M6 4L0 10V90L6 96" fill="none" stroke="#ddd" stroke-width="2"/></svg>`;
function move(id,d){
  S.pos[id]=Math.max(0,(S.pos[id]||0)+d);save();drawMini();
  const r=document.getElementById("r_"+id);
  if(r){r.style.insetInlineStart=pct(S.pos[id]);r.parentElement.querySelector(".pos").textContent=S.pos[id]+"/"+S.steps;
    if(d>0){r.classList.add("run");setTimeout(()=>r.classList.remove("run"),950)}else{r.classList.remove("hurt");void r.offsetWidth;r.classList.add("hurt")}}
  if(d<0)SFX.back();else if(d>0&&!r)SFX.correct();
  if(d>0)checkWin();
}

/* ---------- question flow ---------- */
let sel=new Set(),revealed=false,tv;
function nextIndex(){for(let k=0;k<QS.length;k++){const i=(S.qi+k)%QS.length;if(!S.done.includes(i))return i}S.done=[];return S.qi%QS.length}
function showQ(){clearInterval(tv);S.qi=nextIndex();save();const [q,o]=QS[S.qi];sel.clear();revealed=false;
  document.getElementById("qnum").textContent="سؤال "+(S.done.length+1);
  document.getElementById("qhint").textContent=S.tie?"⚡ سؤال الحسم":"";
  document.getElementById("qtext").textContent=q;
  const os=document.getElementById("opts");os.className="opts";
  os.innerHTML=o.map((x,i)=>`<div class="opt" style="background:${OC[i]}"><span class="L">${LET[i]}</span>${x}</div>`).join("");
  const c=document.getElementById("clock");c.textContent="";c.classList.remove("warn");
  const w=document.getElementById("who");w.classList.remove("on");w.querySelectorAll(".tb").forEach(b=>b.remove());
  (S.tie||S.active).forEach(id=>{const t=T(id),b=document.createElement("button");b.className="tb";b.style.background=t.c;b.textContent=t.flag+" "+t.name;
    b.onclick=()=>{b.classList.toggle("sel");sel.has(id)?sel.delete(id):sel.add(id);SFX.sel()};w.appendChild(b)});
  document.getElementById("bGo").disabled=true;document.getElementById("bRev").disabled=false;
}
document.getElementById("bTime").onclick=()=>{let t=10;const c=document.getElementById("clock");c.textContent=t;c.classList.remove("warn");clearInterval(tv);SFX.whistle();
  tv=setInterval(()=>{t--;c.textContent=t;if(t<=3&&t>0){c.classList.add("warn");SFX.tickHi()}else if(t>0)SFX.tick();
    if(t<=0){clearInterval(tv);c.textContent="📝";SFX.buzzer();splash("📝 ارفعوا الأوراق!")}},1000)};
document.getElementById("bRev").onclick=()=>{if(revealed)return;revealed=true;clearInterval(tv);
  const os=document.getElementById("opts");os.classList.add("rev");os.children[QS[S.qi][2]].classList.add("right");SFX.reveal();setTimeout(SFX.correct,250);
  document.getElementById("who").classList.add("on");document.getElementById("bGo").disabled=false;document.getElementById("bRev").disabled=true};
document.getElementById("bGo").onclick=()=>{if(!revealed||!sel.size)return;
  if(!S.done.includes(S.qi))S.done.push(S.qi);
  if(sel.size){SFX.run();setTimeout(SFX.crowd,500);[...sel].forEach(id=>move(id,1))}else{SFX.back()}
  S.qi++;save();setTimeout(()=>{if(!document.getElementById("winov").classList.contains("on"))showQ()},1300)};
document.getElementById("bSkip").onclick=()=>{S.qi++;save();showQ()};

function checkWin(){
  const pool=S.tie||S.active,max=Math.max(...pool.map(id=>S.pos[id]||0));
  if(max<S.steps)return;
  const top=pool.filter(id=>(S.pos[id]||0)===max);
  clearTimeout(checkWin.k);checkWin.k=setTimeout(()=>{
    const pool2=S.tie||S.active,max2=Math.max(...pool2.map(id=>S.pos[id]||0)),top2=pool2.filter(id=>(S.pos[id]||0)===max2);
    if(top2.length===1){S.tie=null;save();score(top2[0])}
    else{S.tie=top2;save();splash("⚡ سؤال الحسم!");SFX.whistle();drawTrack()}
  },1000);
}
function score(id){const b=document.getElementById("ball_"+id),g=document.getElementById("goal_"+id);
  if(b)b.classList.add("scored");setTimeout(()=>{if(g)g.classList.add("shake");SFX.crowd();SFX.whistle();splash("⚽ قووووول!")},650);
  setTimeout(()=>win(id),2200)}
function win(id){const t=T(id);document.getElementById("winT").textContent=t.name+" فاز بالمباراة!";
  const wr=document.getElementById("winRunner");wr.className="cel-"+id;
  wr.innerHTML=runner(t)+`<div style="font-size:24px;font-weight:700">${t.flag} ${t.player}</div>`;
  document.getElementById("winov").classList.add("on");SFX.fanfare();confetti()}
document.getElementById("closeWin").onclick=()=>document.getElementById("winov").classList.remove("on");

/* ---------- setup ---------- */
function openSetup(){
  const p=document.getElementById("pickT");p.innerHTML="";
  TEAMS.forEach(t=>{const b=document.createElement("button");b.style.background=t.c;b.className=S.active.includes(t.id)?"on":"";
    b.innerHTML=runner(t)+`${t.flag} ${t.name}<br><small>${t.player}</small>`;
    b.onclick=()=>{if(S.active.includes(t.id)){if(S.active.length>2)S.active=S.active.filter(x=>x!==t.id)}else S.active=TEAMS.map(x=>x.id).filter(x=>x===t.id||S.active.includes(x));
      SFX.sel();openSetup()};p.appendChild(b)});
  const l=document.getElementById("len");l.innerHTML="";
  [6,8,10,12,15].forEach(n=>{const b=document.createElement("button");b.textContent=n;b.className=S.steps===n?"on":"";b.onclick=()=>{S.steps=n;SFX.sel();openSetup()};l.appendChild(b)});
  document.getElementById("setup").classList.add("on");
}
document.getElementById("go").onclick=()=>{
  const any=Object.values(S.pos).some(v=>v>0);
  if(!any||confirm("مباراة جديدة؟ سيرجع كل اللاعبين لخط البداية")){S.pos={};S.done=[];S.qi=0;S.tie=null}
  save();document.getElementById("setup").classList.remove("on");drawMini();drawTrack();SFX.whistle();splash("⚽ انطلقوا!");
  if(document.getElementById("vR").classList.contains("on"))showQ();
};
document.getElementById("setBtn").onclick=openSetup;
document.getElementById("sndBtn").onclick=e=>{sound=!sound;e.target.textContent=sound?"🔊":"🔇"};

/* ---------- fx ---------- */
function splash(t){const o=document.getElementById("splash"),d=document.getElementById("splashT");d.textContent=t;
  o.classList.add("on");d.style.animation="none";void d.offsetWidth;d.style.animation="";clearTimeout(splash.k);splash.k=setTimeout(()=>o.classList.remove("on"),1200)}
function confetti(){const c=document.getElementById("cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=S.active.map(id=>T(id).c).concat(["#FFD34D","#fff"]);
  const P=Array.from({length:180},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,v:2+Math.random()*4,r:4+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
  let f=0;(function d(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.a+=.1;x.fillStyle=p.c;x.fillRect(p.x+Math.sin(p.a)*8,p.y,p.r,p.r*1.6)});
    if(++f<260)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height)})()}

/* ---------- init ---------- */
showSlide();drawMini();
if(!Object.keys(S.pos).length)openSetup();
</script>
</body>
</html>
